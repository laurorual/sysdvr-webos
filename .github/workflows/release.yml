name: Build and publish SysDVR WebOS beta

on:
  push:
    branches: [main]
    paths-ignore:
      - io.github.sysdvrwebos.client.manifest.json
      - README.md
      - docs/**
      - tools/log-collector/**
      - scripts/launch-test.sh
      - .github/workflows/log-collector-tests.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-sysdvr-webos
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release version
        shell: bash
        run: |
          APP_VERSION="$(tr -d '\r\n' < VERSION)"
          test "$(python3 -c 'import json; print(json.load(open("webos/appinfo.json"))["version"])')" = "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Install build utilities
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Run host protocol tests
        shell: bash
        run: |
          cmake -S . -B build-host -G Ninja -DSYSDVR_BUILD_HOST_TEST=ON -DSYSDVR_BUILD_WEBOS=OFF
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - name: Setup webOS NDK
        id: ndk
        uses: webosbrew/setup-webos-ndk-action@cd1c0f56e95cef71864abf66805da24428fd8ff2
        with:
          install-location: /tmp

      - name: Install webOS CLI
        shell: bash
        run: npm install -g @webos-tools/cli

      - name: Build ARM IPK
        shell: bash
        env:
          WEBOS_TOOLCHAIN_FILE: ${{ steps.ndk.outputs.cmake-toolchain }}
        run: ./scripts/build-webos.sh

      - name: Generate Homebrew manifest
        shell: bash
        run: |
          ./scripts/gen-webosbrew-manifest.py \
            --source-url https://github.com/laurorual/sysdvr-webos \
            --tag "v${APP_VERSION}" \
            --ipk "dist/io.github.sysdvrwebos.client_${APP_VERSION}_arm.ipk" \
            --output io.github.sysdvrwebos.client.manifest.json
          cat io.github.sysdvrwebos.client.manifest.json

      - name: Commit generated manifest
        shell: bash
        run: |
          if git diff --quiet -- io.github.sysdvrwebos.client.manifest.json 2>/dev/null && \
             git ls-files --error-unmatch io.github.sysdvrwebos.client.manifest.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add io.github.sysdvrwebos.client.manifest.json
          git commit -m "Update Homebrew manifest for v${APP_VERSION} [skip release]"
          git push origin HEAD:main

      - name: Publish beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v${APP_VERSION} >/dev/null 2>&1; then
            gh release upload v${APP_VERSION} \
              "dist/io.github.sysdvrwebos.client_${APP_VERSION}_arm.ipk" \
              io.github.sysdvrwebos.client.manifest.json \
              --clobber
            gh release edit v${APP_VERSION} \
              --title "v${APP_VERSION} beta" \
              --notes-file RELEASE_NOTES_v${APP_VERSION}.md
          else
            gh release create v${APP_VERSION} \
              "dist/io.github.sysdvrwebos.client_${APP_VERSION}_arm.ipk" \
              io.github.sysdvrwebos.client.manifest.json \
              --target main \
              --title "v${APP_VERSION} beta" \
              --notes-file RELEASE_NOTES_v${APP_VERSION}.md
          fi
