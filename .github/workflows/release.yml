name: Build and publish SysDVR WebOS beta

on:
  push:
    branches: [main]
    # Only rebuild when the application or release definition changes.
    # repo.json, documentation and the standalone log collector must NOT
    # silently overwrite a previously published version.
    paths:
      - VERSION
      - CMakeLists.txt
      - 'src/**'
      - 'include/**'
      - 'webos/**'
      - scripts/build-webos.sh
      - scripts/gen-webosbrew-manifest.py
      - '.github/workflows/release.yml'
      - 'RELEASE_NOTES_v*.md'
      - tools/net_test.c
      - tools/sft_protocol_test.c
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-sysdvr-webos
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release version
        shell: bash
        run: |
          APP_VERSION="$(tr -d '\r\n' < VERSION)"
          test "$(python3 -c 'import json; print(json.load(open("webos/appinfo.json"))["version"])')" = "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Refuse to overwrite a published version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v${APP_VERSION}" >/dev/null 2>&1; then
            echo "::error::Release v${APP_VERSION} already exists. Bump VERSION; never overwrite IPK/manifest at an existing tag."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${APP_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${APP_VERSION} already exists. Bump VERSION before publishing."
            exit 1
          fi

      - name: Install build utilities
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Run host protocol tests
        shell: bash
        run: |
          cmake -S . -B build-host -G Ninja -DSYSDVR_BUILD_HOST_TEST=ON -DSYSDVR_BUILD_WEBOS=OFF
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - name: Setup webOS NDK
        id: ndk
        uses: webosbrew/setup-webos-ndk-action@cd1c0f56e95cef71864abf66805da24428fd8ff2
        with:
          install-location: /tmp

      - name: Install webOS CLI
        shell: bash
        run: npm install -g @webos-tools/cli

      - name: Build ARM IPK
        shell: bash
        env:
          WEBOS_TOOLCHAIN_FILE: ${{ steps.ndk.outputs.cmake-toolchain }}
        run: ./scripts/build-webos.sh

      - name: Generate Homebrew manifest
        shell: bash
        run: |
          ./scripts/gen-webosbrew-manifest.py \
            --source-url https://github.com/laurorual/sysdvr-webos \
            --tag "v${APP_VERSION}" \
            --ipk "dist/io.github.sysdvrwebos.client_${APP_VERSION}_arm.ipk" \
            --output io.github.sysdvrwebos.client.manifest.json
          cat io.github.sysdvrwebos.client.manifest.json

      - name: Verify manifest matches locally built IPK
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          ver = os.environ["APP_VERSION"]
          ipk = Path(f"dist/io.github.sysdvrwebos.client_{ver}_arm.ipk")
          manifest = json.loads(Path("io.github.sysdvrwebos.client.manifest.json").read_text())
          digest = hashlib.sha256(ipk.read_bytes()).hexdigest()
          assert manifest["version"] == ver, "Manifest version mismatch"
          assert manifest["ipkSize"] == ipk.stat().st_size, "IPK size mismatch"
          assert manifest["ipkHash"]["sha256"] == digest, "IPK checksum mismatch"
          print(f"Verified v{ver}: {ipk.stat().st_size} bytes, sha256:{digest}")
          PY

      - name: Publish immutable beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          IPK="dist/io.github.sysdvrwebos.client_${APP_VERSION}_arm.ipk"
          MANIFEST="io.github.sysdvrwebos.client.manifest.json"
          gh release create "${TAG}" "${IPK}" "${MANIFEST}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG} beta" \
            --notes-file "RELEASE_NOTES_${TAG}.md"

          # GitHub publishes an authoritative digest for each uploaded asset.
          EXPECTED="sha256:$(sha256sum "${IPK}" | cut -d' ' -f1)"
          REMOTE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name == "io.github.sysdvrwebos.client_'"${APP_VERSION}"'_arm.ipk") | .digest')"
          if [[ "${REMOTE}" != "${EXPECTED}" ]]; then
            echo "::error::Published IPK digest mismatch: expected ${EXPECTED}; remote ${REMOTE}"
            exit 1
          fi
          echo "Release ${TAG} verified: ${EXPECTED}"

      - name: Commit generated manifest
        shell: bash
        run: |
          if git diff --quiet -- io.github.sysdvrwebos.client.manifest.json 2>/dev/null && \
             git ls-files --error-unmatch io.github.sysdvrwebos.client.manifest.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add io.github.sysdvrwebos.client.manifest.json
          git commit -m "Update Homebrew manifest for v${APP_VERSION} [skip release]"
          git push origin HEAD:main
